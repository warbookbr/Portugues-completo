<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Português Completo</title>
  <desc id="desc">Banner animado com partículas verdes e atalho visual para abrir o aplicativo.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020812"/>
      <stop offset="55%" stop-color="#06111c"/>
      <stop offset="100%" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2fb45c"/>
      <stop offset="100%" stop-color="#16813e"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#31e875" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#31e875" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <style>
      .particle { fill:#34e879; transform-box:fill-box; transform-origin:center; }
      .p1 { animation: drift-a 6.8s ease-in-out infinite alternate, twinkle 2.8s ease-in-out infinite; }
      .p2 { animation: drift-b 8.2s ease-in-out infinite alternate, twinkle 3.7s ease-in-out infinite .5s; }
      .p3 { animation: drift-c 7.4s ease-in-out infinite alternate, twinkle 3.1s ease-in-out infinite 1s; }
      .p4 { animation: drift-d 9.1s ease-in-out infinite alternate, twinkle 4.2s ease-in-out infinite .2s; }
      .beam { stroke-dasharray: 12 18; animation: dash 12s linear infinite; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }

      @keyframes drift-a { to { transform: translate(24px,-12px); } }
      @keyframes drift-b { to { transform: translate(-18px,14px); } }
      @keyframes drift-c { to { transform: translate(12px,18px); } }
      @keyframes drift-d { to { transform: translate(-22px,-10px); } }
      @keyframes twinkle { 0%,100% { opacity:.25; } 50% { opacity:1; } }
      @keyframes dash { to { stroke-dashoffset:-240; } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.94); } 50% { opacity:.75; transform:scale(1.06); } }

      @media (prefers-reduced-motion: reduce) {
        .particle,.beam,.pulse { animation:none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>

  <ellipse class="pulse" cx="600" cy="338" rx="235" ry="35" fill="url(#halo)" filter="url(#softGlow)"/>

  <path class="beam" d="M0 310 C230 210 350 345 600 325 C850 345 970 210 1200 310" fill="none" stroke="#1ebc5a" stroke-opacity=".25" stroke-width="2"/>
  <path class="beam" d="M0 330 C250 250 380 360 600 340 C820 360 950 250 1200 330" fill="none" stroke="#42f58a" stroke-opacity=".12" stroke-width="1.5"/>

  <g filter="url(#softGlow)" opacity=".35">
    <circle cx="120" cy="110" r="8" fill="#22dc67"/>
    <circle cx="1040" cy="245" r="10" fill="#22dc67"/>
    <circle cx="970" cy="95" r="6" fill="#22dc67"/>
    <circle cx="210" cy="280" r="7" fill="#22dc67"/>
  </g>

  <g>
    <circle class="particle p1" cx="72" cy="78" r="3"/>
    <circle class="particle p2" cx="148" cy="158" r="5"/>
    <circle class="particle p3" cx="238" cy="76" r="2.5"/>
    <circle class="particle p4" cx="328" cy="302" r="3"/>
    <circle class="particle p2" cx="408" cy="118" r="2"/>
    <circle class="particle p1" cx="520" cy="326" r="3.5"/>
    <circle class="particle p3" cx="690" cy="83" r="2.5"/>
    <circle class="particle p4" cx="766" cy="300" r="4"/>
    <circle class="particle p1" cx="858" cy="126" r="3"/>
    <circle class="particle p2" cx="947" cy="285" r="5"/>
    <circle class="particle p3" cx="1084" cy="148" r="2.5"/>
    <circle class="particle p4" cx="1140" cy="70" r="3"/>
    <circle class="particle p1" cx="96" cy="324" r="2"/>
    <circle class="particle p3" cx="1118" cy="322" r="2"/>
  </g>

  <text x="600" y="155" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#f5f7f8" letter-spacing="-2">
    Português <tspan fill="#2fb45c">Completo</tspan>
  </text>
  <text x="600" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#b8c1c8" letter-spacing="1">
    Do nível zero ao domínio completo
  </text>

  <g>
    <rect x="390" y="244" width="420" height="82" rx="9" fill="#18b653" opacity=".3" filter="url(#softGlow)"/>
    <rect x="390" y="240" width="420" height="82" rx="9" fill="url(#button)" stroke="#38e779" stroke-width="2"/>
    <text x="600" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="5">
      ABRIR APLICATIVO
    </text>
  </g>
</svg>
