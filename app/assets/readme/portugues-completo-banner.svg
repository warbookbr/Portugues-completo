<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Português Completo</title>
  <desc id="desc">Banner animado do projeto Português Completo com partículas verdes e acesso ao aplicativo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020812"/>
      <stop offset="55%" stop-color="#07121d"/>
      <stop offset="100%" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31c763"/>
      <stop offset="100%" stop-color="#169546"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#31e875" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#31e875" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="brightGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      .core{fill:#5cff9f}.halo{fill:#2eea78;opacity:.38;filter:url(#softGlow)}
      .p1{animation:d1 4.4s ease-in-out infinite alternate,t 1.7s ease-in-out infinite}
      .p2{animation:d2 5.0s ease-in-out infinite alternate,t 2.0s ease-in-out infinite .3s}
      .p3{animation:d3 3.8s ease-in-out infinite alternate,t 1.5s ease-in-out infinite .6s}
      .p4{animation:d4 5.6s ease-in-out infinite alternate,t 2.3s ease-in-out infinite .2s}
      .beam{stroke-dasharray:12 16;animation:dash 7s linear infinite}
      .pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .ctaGlow{animation:cta 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes d1{to{transform:translate(38px,-20px)}}
      @keyframes d2{to{transform:translate(-32px,22px)}}
      @keyframes d3{to{transform:translate(24px,28px)}}
      @keyframes d4{to{transform:translate(-36px,-16px)}}
      @keyframes t{0%,100%{opacity:.28}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-220}}
      @keyframes pulse{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:1;transform:scale(1.1)}}
      @keyframes cta{0%,100%{opacity:.16;transform:scale(.98)}50%{opacity:.62;transform:scale(1.03)}}
      @media (prefers-reduced-motion:reduce){.p1,.p2,.p3,.p4,.beam,.pulse,.ctaGlow{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <ellipse class="pulse" cx="600" cy="340" rx="270" ry="44" fill="url(#halo)" filter="url(#brightGlow)"/>
  <rect class="ctaGlow" x="372" y="226" width="456" height="108" rx="16" fill="#35ff84" filter="url(#brightGlow)"/>
  <path class="beam" d="M0 302 C230 192 350 346 600 318 C850 346 970 192 1200 302" fill="none" stroke="#27dc70" stroke-opacity=".5" stroke-width="2.4"/>
  <path class="beam" d="M0 333 C250 242 380 364 600 340 C820 364 950 242 1200 333" fill="none" stroke="#70ffb0" stroke-opacity=".24" stroke-width="1.9"/>
  <g filter="url(#brightGlow)" opacity=".58">
    <circle cx="120" cy="110" r="11" fill="#28ef74"/><circle cx="1040" cy="245" r="13" fill="#28ef74"/><circle cx="970" cy="95" r="8" fill="#28ef74"/><circle cx="210" cy="280" r="9" fill="#28ef74"/><circle cx="1080" cy="120" r="8" fill="#28ef74"/><circle cx="160" cy="315" r="7" fill="#28ef74"/>
  </g>
  <g>
    <g class="p1"><circle class="halo" cx="72" cy="78" r="11"/><circle class="core" cx="72" cy="78" r="3.4"/></g>
    <g class="p2"><circle class="halo" cx="148" cy="158" r="14"/><circle class="core" cx="148" cy="158" r="4.8"/></g>
    <g class="p3"><circle class="halo" cx="238" cy="76" r="9"/><circle class="core" cx="238" cy="76" r="3"/></g>
    <g class="p4"><circle class="halo" cx="328" cy="302" r="11"/><circle class="core" cx="328" cy="302" r="3.7"/></g>
    <g class="p2"><circle class="halo" cx="408" cy="118" r="8"/><circle class="core" cx="408" cy="118" r="2.7"/></g>
    <g class="p1"><circle class="halo" cx="520" cy="326" r="12"/><circle class="core" cx="520" cy="326" r="4.1"/></g>
    <g class="p3"><circle class="halo" cx="690" cy="83" r="9"/><circle class="core" cx="690" cy="83" r="3"/></g>
    <g class="p4"><circle class="halo" cx="766" cy="300" r="13"/><circle class="core" cx="766" cy="300" r="4.2"/></g>
    <g class="p1"><circle class="halo" cx="858" cy="126" r="10"/><circle class="core" cx="858" cy="126" r="3.3"/></g>
    <g class="p2"><circle class="halo" cx="947" cy="285" r="15"/><circle class="core" cx="947" cy="285" r="5.4"/></g>
    <g class="p3"><circle class="halo" cx="1084" cy="148" r="9"/><circle class="core" cx="1084" cy="148" r="2.9"/></g>
    <g class="p4"><circle class="halo" cx="1140" cy="70" r="10"/><circle class="core" cx="1140" cy="70" r="3.2"/></g>
    <g class="p1"><circle class="halo" cx="96" cy="324" r="8"/><circle class="core" cx="96" cy="324" r="2.7"/></g>
    <g class="p3"><circle class="halo" cx="1118" cy="322" r="8"/><circle class="core" cx="1118" cy="322" r="2.7"/></g>
    <g class="p4"><circle class="halo" cx="292" cy="122" r="10"/><circle class="core" cx="292" cy="122" r="3.2"/></g>
    <g class="p1"><circle class="halo" cx="1018" cy="186" r="11"/><circle class="core" cx="1018" cy="186" r="3.6"/></g>
    <g class="p2"><circle class="halo" cx="182" cy="214" r="9"/><circle class="core" cx="182" cy="214" r="3.1"/></g>
    <g class="p3"><circle class="halo" cx="620" cy="92" r="8"/><circle class="core" cx="620" cy="92" r="2.6"/></g>
  </g>
  <text x="600" y="155" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="76" font-weight="700" fill="#f5f7f8" letter-spacing="-2">Português <tspan fill="#2fb45c">Completo</tspan></text>
  <text x="600" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#c4ccd2" letter-spacing="1">Do nível zero ao domínio completo</text>
  <rect x="390" y="240" width="420" height="82" rx="9" fill="url(#button)" stroke="#56ffa0" stroke-width="2.4"/>
  <text x="600" y="291" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#fff" letter-spacing="5">ABRIR APLICATIVO</text>
</svg>
