name: Apply T1 N0 atomic wiring

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 't1-9-atomic-promotion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: t1-9-atomic-promotion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply atomic wiring
        run: node scripts/apply-t1-atomic-wiring.mjs

      - name: Validate migration and renderer
        run: |
          node scripts/test-progress-migration-t1.mjs
          node scripts/test-progress-migration-wiring.mjs
          node scripts/test-classic-renderer.mjs

      - name: Commit atomic wiring
        run: |
          if git diff --quiet; then
            echo 'Atomic wiring already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/app.js scripts/test-classic-renderer.mjs scripts/capture-classic-visuals.sh
          git commit -m 'feat: ativa migração e aliases da nova entrada N0'
          git push origin HEAD:t1-9-atomic-promotion
