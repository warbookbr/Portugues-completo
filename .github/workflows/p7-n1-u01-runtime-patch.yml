name: Apply P7 N1 U01 runtime patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'p7-n1-u01-inventory' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n1-u01-inventory
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply reusable runtime adaptation
        run: python3 scripts/p7-n1-u01-runtime-patch.py
      - name: Validate N1-U01 and prior regressions
        run: |
          node scripts/validate-contracts.mjs
          node scripts/audit-p7-n1-u01.mjs
          node scripts/audit-p7-n0-u06.mjs
          node scripts/test-p7-u06-communication.mjs
          node scripts/test-p7-u05-writing.mjs
          node scripts/test-classic-renderer.mjs
      - name: Remove temporary patch tooling
        run: |
          rm scripts/p7-n1-u01-runtime-patch.py
          rm .github/workflows/p7-n1-u01-runtime-patch.yml
      - name: Commit durable adaptation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(p7): adapta runtime para leitura da N1-U01'
          git push origin HEAD:p7-n1-u01-inventory
