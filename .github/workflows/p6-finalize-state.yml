name: Finalize P6 state

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'p6-ai-feedback-homologation' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p6-ai-feedback-homologation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Close P6 and activate P7
        run: node scripts/p6-finalize-state.mjs
      - name: Validate structure
        run: node scripts/validate-project.mjs
      - name: Commit canonical state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_INDEX.md docs/estado-implementacao-classico.md docs/roadmap-produto.md
          git commit -m 'docs(p6): homologa P6 e ativa P7'
          git push origin HEAD:p6-ai-feedback-homologation
