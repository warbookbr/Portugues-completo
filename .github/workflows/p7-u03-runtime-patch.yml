name: Apply P7 U03 public language patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'p7-n0-u03-catalog' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u03-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply public language patch
        run: node scripts/p7-u03-public-language-patch.mjs
      - name: Test classic renderer
        run: node scripts/test-classic-renderer.mjs
      - name: Capture P7 N0-U03 visual smoke
        run: bash scripts/capture-p7-u03-visuals.sh
      - name: Commit public language fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/ui/classic-renderer.js scripts/capture-p7-u03-visuals.sh
          git commit -m 'fix(p7): limpa linguagem pública da N0-U03'
          git push origin HEAD:p7-n0-u03-catalog
