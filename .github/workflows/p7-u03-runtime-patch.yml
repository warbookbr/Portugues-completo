name: Apply P7 U03 evidence patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'p7-n0-u03-catalog' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u03-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Neutralize temporary template interpolation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/p7-u03-evidence-patch.mjs')
          text = path.read_text()
          for token in ('${documentRuntime.id}', '${block.id}'):
              text = text.replace(token, '\\' + token)
          lines = []
          for line in text.splitlines():
              if 'const controls = [...form.querySelectorAll(`' in line:
                  lines.append('    const controls = [...form.elements].filter(control => control.name === key);')
              else:
                  lines.append(line)
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Apply evidence contract patch
        run: node scripts/p7-u03-evidence-patch.mjs
      - name: Validate contracts
        run: node scripts/validate-contracts.mjs
      - name: Audit N0-U03
        run: node scripts/audit-p7-n0-u03.mjs
      - name: Test N0-U03 evidence semantics
        run: node scripts/test-p7-u03-evidence.mjs
      - name: Test progress regression
        run: node scripts/test-progress-service.mjs
      - name: Commit evidence contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schemas/lesson.schema.json schemas/verification.schema.json schemas/progress.schema.json app/js/services/progress-service.js app/js/services/content-normalization-rules-v1.js app/js/ui/classic-progress-binding.js
          git commit -m 'feat(p7): preserva evidência agregada da N0-U03'
          git push origin HEAD:p7-n0-u03-catalog
