name: Fix P7 U06 public UI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'p7-n0-u06-catalog-v2' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u06-catalog-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply public UI fix
        run: python3 scripts/fix-p7-u06-public-ui.py
      - name: Validate U06 UI and semantics
        run: |
          node scripts/audit-p7-n0-u06.mjs
          node scripts/test-p7-u06-communication.mjs
          node scripts/test-classic-renderer.mjs
          bash scripts/capture-p7-u06-visuals.sh
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/ui/classic-renderer.js scripts/test-p7-u06-communication.mjs scripts/capture-p7-u06-visuals.sh
          git commit -m 'fix(p7): limpa linguagem pública da U06'
          git push origin HEAD:p7-n0-u06-catalog-v2
