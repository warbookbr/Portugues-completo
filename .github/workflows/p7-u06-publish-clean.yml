name: Publish P7 U06 clean

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'p7-n0-u06-catalog-v2' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u06-catalog-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Recover publication recipe
        run: git show origin/p7-n0-u06-catalog:scripts/p7-u06-publish.py > /tmp/p7-u06-publish.py
      - name: Materialize U06 publication
        run: |
          printf '%s\n' 'temporary runtime-ready gate for clean publication' > scripts/p7-u06-runtime-ready.marker
          python3 /tmp/p7-u06-publish.py
          rm scripts/p7-u06-runtime-ready.marker
      - name: Validate publication
        run: |
          node scripts/validate-contracts.mjs
          node scripts/validate-catalog.mjs
          node scripts/test-content-catalog.mjs
          node scripts/audit-p7-n0-u06.mjs
          node scripts/test-p7-u06-communication.mjs
          node scripts/test-classic-renderer.mjs
      - name: Preserve prior P7 lots
        run: |
          node scripts/audit-p7-n0-u05.mjs
          node scripts/test-p7-u05-writing.mjs
          node scripts/test-p7-u05-public-ui.mjs
          node scripts/test-p7-u05-homologation.mjs
          node scripts/audit-p7-n0-u04.mjs
          node scripts/test-p7-u04-evidence.mjs
          node scripts/test-p7-u04-homologation.mjs
          node scripts/audit-p7-n0-u03.mjs
          node scripts/test-p7-u03-evidence.mjs
      - name: Commit published U06
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/course.json content/units/006-usando-lingua-cotidiano/unit.json scripts/test-content-catalog.mjs scripts/test-classic-renderer.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p7): publica N0-U06 no catálogo Clássico'
          git push origin HEAD:p7-n0-u06-catalog-v2
