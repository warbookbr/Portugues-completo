name: Cleanup T1 promotion tooling

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 't1-9-atomic-promotion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: t1-9-atomic-promotion
          fetch-depth: 0

      - name: Remove temporary promotion tooling
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/materialize-t1-n0.yml \
            .github/workflows/apply-t1-atomic-wiring.yml \
            .github/workflows/finalize-t1-atomic-promotion.yml \
            .github/workflows/generate-t1-final-package.yml \
            .github/workflows/commit-t1-final-shape.yml \
            .github/workflows/cleanup-t1-promotion-tooling.yml \
            scripts/apply-t1-atomic-wiring.mjs \
            scripts/finalize-t1-atomic-promotion.mjs

      - name: Validate repository map after cleanup
        run: node scripts/validate-project.mjs

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Temporary tooling already removed.'
            exit 0
          fi
          git commit -m 'chore: remove tooling temporário da promoção T1.9'
          git push origin HEAD:t1-9-atomic-promotion
