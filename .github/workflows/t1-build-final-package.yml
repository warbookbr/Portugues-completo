name: Build T1 final package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    if: github.head_ref == 't1-9-atomic-promotion' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: t1-9-atomic-promotion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build atomic T1.9 shape
        run: node scripts/build-t1-atomic-package.mjs

      - name: Update project index in package
        run: node scripts/t1-package-index-fix.mjs

      - name: Apply historical compatibility fixes
        run: node scripts/t1-package-compat-fixes.mjs

      - name: Apply composite renderer support
        run: node scripts/t1-package-renderer-fix.mjs

      - name: Clean public student UI
        run: node scripts/t1-package-public-ui-fix.mjs

      - name: Update T1 renderer regressions
        run: node scripts/t1-package-test-updates.mjs

      - name: Update T1 visual smoke
        run: node scripts/t1-package-smoke-fix.mjs

      - name: Validate repository structure
        run: node scripts/validate-project.mjs
      - name: Validate JSON syntax
        run: node scripts/validate-json.mjs
      - name: Validate contract schemas
        run: node scripts/validate-contracts.mjs
      - name: Test content normalization
        run: node scripts/test-content-normalizer.mjs
      - name: Test T1 staged authoring
        run: node scripts/test-t1-content-authoring.mjs
      - name: Validate publication catalog
        run: node scripts/validate-catalog.mjs
      - name: Test catalog discovery
        run: node scripts/test-content-catalog.mjs
      - name: Test progress engine
        run: node scripts/test-progress-service.mjs
      - name: Test T1 progress migration
        run: node scripts/test-progress-migration-t1.mjs
      - name: Test T1 progress migration wiring
        run: node scripts/test-progress-migration-wiring.mjs
      - name: Test T1 atomic promotion
        run: node scripts/test-t1-atomic-promotion.mjs
      - name: Test progress policies
        run: node scripts/test-progress-policies.mjs
      - name: Test progress merge edge cases
        run: node scripts/test-progress-merge-edge-cases.mjs
      - name: Test GitHub Gist service
        run: node scripts/test-github-service.mjs
      - name: Test progress sync
        run: node scripts/test-progress-sync-service.mjs
      - name: Test classic renderer
        run: node scripts/test-classic-renderer.mjs
      - name: Capture classic visual smoke
        run: bash scripts/capture-classic-visuals.sh

      - name: Commit validated product shape
        run: |
          rm -rf artifacts/classic-visuals
          git restore .github/workflows/validate-project.yml
          git rm -f \
            scripts/build-t1-atomic-package.mjs \
            scripts/t1-package-index-fix.mjs \
            scripts/t1-package-compat-fixes.mjs \
            scripts/t1-package-renderer-fix.mjs \
            scripts/t1-package-public-ui-fix.mjs \
            scripts/t1-package-test-updates.mjs \
            scripts/t1-package-smoke-fix.mjs
          git add -A
          git reset -- artifacts/classic-visuals 2>/dev/null || true
          git reset -- .github/workflows/t1-build-final-package.yml .github/workflows/validate-project.yml
          if git diff --cached --quiet; then
            echo 'Nenhuma forma final para materializar.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: materializa promoção atômica T1.9'
          git push origin HEAD:t1-9-atomic-promotion
