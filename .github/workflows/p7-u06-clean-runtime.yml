name: Build P7 U06 clean runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'p7-n0-u06-catalog-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u06-catalog-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Recover durable U06 sources from historical branch
        run: |
          git show origin/p7-n0-u06-catalog:scripts/audit-p7-n0-u06.mjs > scripts/audit-p7-n0-u06.mjs
          git show origin/p7-n0-u06-catalog:scripts/test-p7-u06-communication.mjs > scripts/test-p7-u06-communication.mjs
          git show origin/p7-n0-u06-catalog:scripts/p7-u06-runtime-patch-v2.py > /tmp/p7-u06-runtime-patch-v2.py
      - name: Adapt historical patch to current renderer binder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/p7-u06-runtime-patch-v2.py')
          text = p.read_text()
          start = text.index("if 'function bindContentTranscriptControls(root)' not in text:")
          end = text.index("\nsave(file, text)", start)
          replacement = r'''if 'function bindContentTranscriptControls(root, document)' not in text:
              marker = '\nexport function bindClassicRenderer(root, document = null) {'
              helper = '''\nfunction bindContentTranscriptControls(root, document) {\n  if (!document) return;\n  const byId = new Map((document.blocks || []).map(block => [block.id, block]));\n  root.querySelectorAll('[data-delayed-transcript-control]').forEach(control => {\n    const card = control.closest('[id]');\n    const block = card ? byId.get(card.id) : null;\n    const button = control.querySelector('[data-transcript-reveal]');\n    const slot = control.querySelector('[data-transcript-slot]');\n    const tts = card?.querySelector('[data-tts]');\n    if (!block || !button || !slot || typeof block.content?.transcriptAfterAttempt !== 'string') return;\n    if (tts) tts.addEventListener('click', () => { button.disabled = false; });\n    button.addEventListener('click', () => {\n      const title = document.createElement('strong');\n      title.textContent = 'Transcrição';\n      const body = document.createElement('div');\n      body.textContent = block.content.transcriptAfterAttempt;\n      slot.replaceChildren(title, body);\n      button.hidden = true;\n    });\n  });\n}\n'''
              if marker not in text:
                  raise RuntimeError('renderer: bindClassicRenderer ausente')
              text = text.replace(marker, helper + marker, 1)

          if 'bindContentTranscriptControls(root, document);' not in text:
              marker = '  if (!document) return;'
              if marker not in text:
                  raise RuntimeError('renderer: retorno sem document ausente')
              text = text.replace(marker, '  bindContentTranscriptControls(root, document);\n' + marker, 1)
'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Apply U06 runtime adaptation over current main
        run: python3 /tmp/p7-u06-runtime-patch-v2.py
      - name: Add permanent CI gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/validate-project.yml')
          text = p.read_text()
          block = """      - name: Audit P7 N0-U06\n        run: node scripts/audit-p7-n0-u06.mjs\n\n      - name: Test P7 N0-U06 communication semantics\n        run: node scripts/test-p7-u06-communication.mjs\n\n"""
          if block not in text:
              marker = "      - name: Test progress policies\n"
              if marker not in text:
                  raise SystemExit('CI marker not found')
              text = text.replace(marker, block + marker, 1)
          p.write_text(text)
          PY
      - name: Validate U06 runtime and semantics
        run: |
          node scripts/validate-contracts.mjs
          node scripts/audit-p7-n0-u06.mjs
          node scripts/test-p7-u06-communication.mjs
      - name: Preserve prior lots
        run: |
          node scripts/audit-p7-n0-u05.mjs
          node scripts/test-p7-u05-writing.mjs
          node scripts/test-p7-u05-public-ui.mjs
          node scripts/test-p7-u05-homologation.mjs
          node scripts/audit-p7-n0-u04.mjs
          node scripts/test-p7-u04-evidence.mjs
          node scripts/test-p7-u04-homologation.mjs
          node scripts/audit-p7-n0-u03.mjs
          node scripts/test-p7-u03-evidence.mjs
      - name: Validate progress and renderer
        run: |
          node scripts/test-progress-service.mjs
          node scripts/test-classic-renderer.mjs
      - name: Commit durable U06 runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/js/services/content-normalizer-v1.js \
            app/js/services/content-normalization-rules-v1.js \
            app/js/ui/classic-renderer.js \
            app/js/ui/classic-progress-binding.js \
            scripts/audit-p7-n0-u06.mjs \
            scripts/test-p7-u06-communication.mjs \
            .github/workflows/validate-project.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p7): adapta runtime para N0-U06'
          git push origin HEAD:p7-n0-u06-catalog-v2
