name: Commit T1 final promotion shape

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-final-shape:
    if: github.head_ref == 't1-9-atomic-promotion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: t1-9-atomic-promotion
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate publication and atomic wiring
        run: |
          node scripts/promote-t1-n0-content.mjs
          node scripts/apply-t1-atomic-wiring.mjs
          node scripts/finalize-t1-atomic-promotion.mjs || true

      - name: Restore temporary tooling so this commit only carries product changes
        run: |
          git checkout HEAD -- \
            .github/workflows/materialize-t1-n0.yml \
            .github/workflows/apply-t1-atomic-wiring.yml \
            .github/workflows/finalize-t1-atomic-promotion.yml \
            .github/workflows/generate-t1-final-package.yml \
            .github/workflows/commit-t1-final-shape.yml \
            scripts/apply-t1-atomic-wiring.mjs \
            scripts/finalize-t1-atomic-promotion.mjs

      - name: Validate generated final shape
        run: |
          node scripts/validate-project.mjs
          node scripts/validate-json.mjs
          node scripts/validate-contracts.mjs
          node scripts/validate-catalog.mjs
          node scripts/test-content-catalog.mjs
          node scripts/test-content-normalizer.mjs
          node scripts/test-t1-content-authoring.mjs
          node scripts/test-progress-migration-t1.mjs
          node scripts/test-progress-migration-wiring.mjs
          node scripts/test-progress-service.mjs
          node scripts/test-progress-policies.mjs
          node scripts/test-progress-merge-edge-cases.mjs
          node scripts/test-github-service.mjs
          node scripts/test-progress-sync-service.mjs
          node scripts/test-classic-renderer.mjs

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            content/course.json \
            content/units/001-fala-sons-escrita \
            content/units/002-das-silabas-as-palavras \
            app/js/app.js \
            scripts/test-classic-renderer.mjs \
            scripts/capture-classic-visuals.sh \
            producao-midia/FILA-MIDIA.md \
            PROJECT_INDEX.md
          if git diff --cached --quiet; then
            echo 'Final product shape already committed.'
            exit 0
          fi
          git commit -m 'feat: materializa promoção atômica da nova entrada N0'
          git push origin HEAD:t1-9-atomic-promotion
