name: Materialize T1.10 exit checkpoint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 't1-10-homologation' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: t1-10-homologation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Patch N0 exit checkpoint
        run: node scripts/t1-10-fix-exit.mjs
      - name: Validate JSON
        run: node scripts/validate-json.mjs
      - name: Commit checkpoint correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/levels/000-fundamentos/exit-verification.json
          git commit -m 'fix: alinha checkpoint N0 às verificações T1 V02'
          git push origin HEAD:t1-10-homologation
