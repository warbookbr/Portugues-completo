name: Validate project structure

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate repository structure
        run: node scripts/validate-project.mjs

      - name: Validate JSON syntax
        run: node scripts/validate-json.mjs

      - name: Validate contract schemas
        run: node scripts/validate-contracts.mjs

      - name: Test content normalization
        run: node scripts/test-content-normalizer.mjs

      - name: Test T1 staged authoring
        run: node scripts/test-t1-content-authoring.mjs

      - name: Validate publication catalog
        run: node scripts/validate-catalog.mjs

      - name: Test catalog discovery
        run: node scripts/test-content-catalog.mjs

      - name: Test progress engine
        run: node scripts/test-progress-service.mjs

      - name: Test T1 progress migration
        run: node scripts/test-progress-migration-t1.mjs

      - name: Test T1 progress migration wiring
        run: node scripts/test-progress-migration-wiring.mjs

      - name: Test T1 atomic promotion
        run: node scripts/test-t1-atomic-promotion.mjs

      - name: Test T1 homologation
        run: node scripts/test-t1-homologation.mjs

      - name: Test P6 AI feedback core
        run: node scripts/test-ai-feedback-service.mjs

      - name: Test P6 AI companion
        run: node scripts/test-ai-feedback-companion.mjs

      - name: Test P6 AI feedback pilot
        run: node scripts/test-ai-feedback-pilot.mjs

      - name: Test P6 AI settings security
        run: node scripts/test-ai-settings-security.mjs

      - name: Test P6 homologation
        run: node scripts/test-p6-homologation.mjs

      - name: Audit P7 N0-U03
        run: node scripts/audit-p7-n0-u03.mjs

      - name: Test P7 N0-U03 evidence semantics
        run: node scripts/test-p7-u03-evidence.mjs

      - name: Audit P7 N0-U04
        run: node scripts/audit-p7-n0-u04.mjs

      - name: Test P7 N0-U04 evidence semantics
        run: node scripts/test-p7-u04-evidence.mjs

      - name: Test P7 N0-U04 homologation
        run: node scripts/test-p7-u04-homologation.mjs

      - name: Audit P7 N0-U05
        run: node scripts/audit-p7-n0-u05.mjs

      - name: Test P7 N0-U05 writing semantics
        run: node scripts/test-p7-u05-writing.mjs

      - name: Test P7 N0-U05 public UI
        run: node scripts/test-p7-u05-public-ui.mjs

      - name: Test P7 N0-U05 homologation
        run: node scripts/test-p7-u05-homologation.mjs

      - name: Audit P7 N0-U06
        run: node scripts/audit-p7-n0-u06.mjs

      - name: Test P7 N0-U06 communication semantics
        run: node scripts/test-p7-u06-communication.mjs

      - name: Test P7 N0-U06 homologation
        run: node scripts/test-p7-u06-homologation.mjs

      - name: Audit P7 N1-U01
        run: node scripts/audit-p7-n1-u01.mjs

      - name: Test P7 N1-U01 reading semantics
        run: node scripts/test-p7-n1-u01-reading.mjs

      - name: Test progress policies
        run: node scripts/test-progress-policies.mjs

      - name: Test progress merge edge cases
        run: node scripts/test-progress-merge-edge-cases.mjs

      - name: Test GitHub Gist service
        run: node scripts/test-github-service.mjs

      - name: Test progress sync
        run: node scripts/test-progress-sync-service.mjs

      - name: Test classic renderer
        run: node scripts/test-classic-renderer.mjs

      - name: Capture classic visual smoke
        run: bash scripts/capture-classic-visuals.sh

      - name: Capture P6 AI visual smoke
        run: bash scripts/capture-ai-feedback-visuals.sh

      - name: Capture P7 N0-U03 visual smoke
        run: bash scripts/capture-p7-u03-visuals.sh

      - name: Capture P7 N0-U04 visual smoke
        run: bash scripts/capture-p7-u04-visuals.sh

      - name: Capture P7 N0-U05 visual smoke
        run: bash scripts/capture-p7-u05-visuals.sh

      - name: Capture P7 N0-U06 visual smoke
        run: bash scripts/capture-p7-u06-visuals.sh

      - name: Upload classic visual smoke
        uses: actions/upload-artifact@v4
        with:
          name: classic-visual-smoke
          path: artifacts/classic-visuals/*.png
          if-no-files-found: error

      - name: Upload P7 N0-U03 visual smoke
        uses: actions/upload-artifact@v4
        with:
          name: p7-n0-u03-visual-smoke
          path: artifacts/p7-u03-visuals/*.png
          if-no-files-found: error

      - name: Upload P7 N0-U04 visual smoke
        uses: actions/upload-artifact@v4
        with:
          name: p7-n0-u04-visual-smoke
          path: artifacts/p7-u04-visuals/*.png
          if-no-files-found: error

      - name: Upload P7 N0-U05 visual smoke
        uses: actions/upload-artifact@v4
        with:
          name: p7-n0-u05-visual-smoke
          path: artifacts/p7-u05-visuals/*.png
          if-no-files-found: error

      - name: Upload P7 N0-U06 visual smoke
        uses: actions/upload-artifact@v4
        with:
          name: p7-n0-u06-visual-smoke
          path: artifacts/p7-u06-visuals/*.png
          if-no-files-found: error
