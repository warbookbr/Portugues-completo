name: Generate T1 final promotion package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 't1-9-atomic-promotion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: t1-9-atomic-promotion

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate final publication shape
        run: |
          node scripts/promote-t1-n0-content.mjs
          node scripts/apply-t1-atomic-wiring.mjs
          node scripts/finalize-t1-atomic-promotion.mjs || true

      - name: Restore finalization inputs removed by self-cleaner
        run: |
          git checkout HEAD -- scripts/promote-t1-n0-content.mjs schemas/fixtures/p1/manifest.json

      - name: Validate final package
        run: |
          node scripts/validate-json.mjs
          node scripts/validate-contracts.mjs
          node scripts/validate-catalog.mjs
          node scripts/test-content-catalog.mjs
          node scripts/test-content-normalizer.mjs
          node scripts/test-t1-content-authoring.mjs
          node scripts/test-progress-migration-t1.mjs
          node scripts/test-progress-migration-wiring.mjs
          node scripts/test-progress-service.mjs
          node scripts/test-progress-policies.mjs
          node scripts/test-progress-merge-edge-cases.mjs
          node scripts/test-github-service.mjs
          node scripts/test-progress-sync-service.mjs
          node scripts/test-classic-renderer.mjs

      - name: Assemble package
        run: |
          mkdir -p artifacts/t1-final-package
          cp --parents \
            content/course.json \
            content/units/001-fala-sons-escrita/unit.json \
            content/units/001-fala-sons-escrita/integrated-verification-v02.json \
            content/units/001-fala-sons-escrita/lessons/*.json \
            content/units/001-fala-sons-escrita/legacy/lessons/*.json \
            content/units/002-das-silabas-as-palavras/unit.json \
            content/units/002-das-silabas-as-palavras/integrated-verification-v02.json \
            content/units/002-das-silabas-as-palavras/lessons/*.json \
            app/js/app.js \
            scripts/test-classic-renderer.mjs \
            scripts/capture-classic-visuals.sh \
            producao-midia/FILA-MIDIA.md \
            PROJECT_INDEX.md \
            schemas/fixtures/p1/manifest.json \
            scripts/promote-t1-n0-content.mjs \
            artifacts/t1-final-package/

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: t1-final-promotion-package
          path: artifacts/t1-final-package
          if-no-files-found: error
