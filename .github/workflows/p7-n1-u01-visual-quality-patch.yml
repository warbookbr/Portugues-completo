name: Apply P7 N1 U01 visual quality patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'p7-n1-u01-inventory' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n1-u01-inventory
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply visual quality refinement
        run: python3 scripts/p7-n1-u01-visual-quality-patch.py
      - name: Validate N1-U01 public layer
        run: |
          node scripts/audit-p7-n1-u01.mjs
          node scripts/test-p7-n1-u01-reading.mjs
          node scripts/test-p7-n1-u01-public-ui.mjs
          node scripts/test-classic-renderer.mjs
          bash scripts/capture-p7-n1-u01-visuals.sh
      - name: Remove temporary patch tooling
        run: |
          rm scripts/p7-n1-u01-visual-quality-patch.py
          rm .github/workflows/p7-n1-u01-visual-quality-patch.yml
      - name: Commit durable visual refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p7): refina apresentação visual da N1-U01'
          git push origin HEAD:p7-n1-u01-inventory
