name: Visual check P7 N1 U01

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    if: github.head_ref == 'p7-n1-u01-inventory' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n1-u01-inventory
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate N1-U01 before capture
        run: |
          node scripts/audit-p7-n1-u01.mjs
          node scripts/test-p7-n1-u01-reading.mjs
          node scripts/test-p7-n1-u01-public-ui.mjs
      - name: Capture N1-U01
        run: bash scripts/capture-p7-n1-u01-visuals.sh
      - name: Upload N1-U01
        uses: actions/upload-artifact@v4
        with:
          name: p7-n1-u01-visual-isolated
          path: artifacts/p7-n1-u01-visuals/*.png
          if-no-files-found: error
