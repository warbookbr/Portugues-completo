name: Close P7 U06

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    if: github.head_ref == 'p7-n0-u06-catalog-v2' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u06-catalog-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply canonical closeout
        run: python3 scripts/close-p7-u06.py
      - name: Validate structure and homologation
        run: |
          node scripts/validate-project.mjs
          node scripts/validate-catalog.mjs
          node scripts/test-content-catalog.mjs
          node scripts/audit-p7-n0-u06.mjs
          node scripts/test-p7-u06-communication.mjs
          node scripts/test-p7-u06-homologation.mjs
      - name: Commit canonical closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_INDEX.md docs/roadmap-produto.md docs/estado-implementacao-classico.md
          git commit -m 'docs(p7): homologa N0-U06 e avança para N1-U01'
          git push origin HEAD:p7-n0-u06-catalog-v2
