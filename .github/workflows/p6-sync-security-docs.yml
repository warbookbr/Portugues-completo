name: Sync P6 security docs

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.head_ref == 'p6-ai-feedback-core' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p6-ai-feedback-core
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synchronize canonical docs
        run: node scripts/p6-sync-security-docs.mjs
      - name: Validate repository structure
        run: node scripts/validate-project.mjs
      - name: Commit canonical docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_INDEX.md docs/arquitetura.md docs/avaliacao-ia.md docs/estado-implementacao-classico.md
          git commit -m 'docs(p6): alinha transporte seguro e cursor P6'
          git push origin HEAD:p6-ai-feedback-core
