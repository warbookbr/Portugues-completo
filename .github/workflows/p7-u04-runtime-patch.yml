name: Apply P7 U04 public UI fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'p7-n0-u04-catalog' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u04-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply public UI fix
        run: python3 scripts/p7-u04-public-ui-fix.py
      - name: Test classic renderer
        run: node scripts/test-classic-renderer.mjs
      - name: Capture N0-U04 visual smoke
        run: bash scripts/capture-p7-u04-visuals.sh
      - name: Commit public UI fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/ui/classic-renderer.js scripts/test-classic-renderer.mjs scripts/capture-p7-u04-visuals.sh
          git commit -m 'fix(p7): limpa linguagem pública da N0-U04'
          git push origin HEAD:p7-n0-u04-catalog
