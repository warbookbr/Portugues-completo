name: Close T1 canonical state

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-state:
    if: github.head_ref == 't1-10-homologation' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: t1-10-homologation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synchronize canonical state
        run: node scripts/t1-10-close-state.mjs
      - name: Commit canonical docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_INDEX.md docs/estado-implementacao-classico.md docs/roadmap-produto.md docs/plano-fundamentos-claros.md
          git commit -m 'docs: homologa T1 e ativa P6'
          git push origin HEAD:t1-10-homologation
