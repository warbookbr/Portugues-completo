name: Repair P7 U05 public renderer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'p7-n0-u05-catalog' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u05-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore renderer from pre-regression head
        run: git show 839f857e4e9dbfc2b3043d121ce28538156ee8a0^:app/js/ui/classic-renderer.js > app/js/ui/classic-renderer.js
      - name: Apply minimal U05 public-language fix
        run: python3 scripts/p7-u05-public-ui-fix.py
      - name: Validate U04 preservation
        run: |
          node scripts/audit-p7-n0-u04.mjs
          node scripts/test-p7-u04-evidence.mjs
          node scripts/test-p7-u04-homologation.mjs
      - name: Validate U05 semantics and public UI
        run: |
          node scripts/audit-p7-n0-u05.mjs
          node scripts/test-p7-u05-writing.mjs
          node scripts/test-p7-u05-public-ui.mjs
          node scripts/test-classic-renderer.mjs
      - name: Capture U05 visual smoke
        run: bash scripts/capture-p7-u05-visuals.sh
      - name: Commit repaired renderer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/ui/classic-renderer.js
          git commit -m 'fix(p7): preserva renderer U04 ao limpar linguagem U05'
          git push origin HEAD:p7-n0-u05-catalog
