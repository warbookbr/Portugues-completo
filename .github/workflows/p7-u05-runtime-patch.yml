name: Apply P7 U05 runtime patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'p7-n0-u05-catalog' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u05-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply U05 runtime patch
        run: python3 scripts/p7-u05-runtime-patch.py
      - name: Validate contracts
        run: node scripts/validate-contracts.mjs
      - name: Audit N0-U05
        run: node scripts/audit-p7-n0-u05.mjs
      - name: Test U04 regressions
        run: |
          node scripts/audit-p7-n0-u04.mjs
          node scripts/test-p7-u04-evidence.mjs
          node scripts/test-p7-u04-homologation.mjs
      - name: Test U03 regressions
        run: |
          node scripts/audit-p7-n0-u03.mjs
          node scripts/test-p7-u03-evidence.mjs
      - name: Test progress regression
        run: node scripts/test-progress-service.mjs
      - name: Test classic renderer regression
        run: node scripts/test-classic-renderer.mjs
      - name: Commit runtime adaptation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/services/content-normalizer-v1.js app/js/services/content-normalization-rules-v1.js app/js/services/progress-service.js app/js/ui/classic-deterministic-evaluator.js app/js/ui/classic-renderer.js app/js/ui/classic-progress-binding.js
          git commit -m 'feat(p7): adapta runtime para autoria da N0-U05'
          git push origin HEAD:p7-n0-u05-catalog
