name: Close P7 N0-U05

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    if: github.head_ref == 'p7-n0-u05-catalog' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p7-n0-u05-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Update canonical state
        run: python3 scripts/p7-u05-close-docs.py
      - name: Validate closure
        run: |
          node scripts/validate-project.mjs
          node scripts/validate-json.mjs
          node scripts/validate-catalog.mjs
          node scripts/test-content-catalog.mjs
          node scripts/audit-p7-n0-u05.mjs
          node scripts/test-p7-u05-writing.mjs
          node scripts/test-p7-u05-public-ui.mjs
          node scripts/test-classic-renderer.mjs
          grep -Fq 'N0-U06 — Usando a língua no cotidiano' docs/estado-implementacao-classico.md
          grep -Fq 'docs/homologacao-p7-n0-u05.md' PROJECT_INDEX.md
      - name: Remove temporary P7 U05 tooling
        run: |
          git rm .github/workflows/p7-u05-runtime-patch.yml
          git rm scripts/p7-u05-*.py
      - name: Commit closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_INDEX.md docs/estado-implementacao-classico.md docs/roadmap-produto.md docs/homologacao-p7-n0-u05.md
          git commit -m 'docs(p7): homologa N0-U05 e avança para N0-U06'
          git push origin HEAD:p7-n0-u05-catalog
