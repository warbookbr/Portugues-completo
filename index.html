<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Português Completo</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f5f7fb, #e8eef9);
      color: #172033;
      padding: 24px;
    }
    .gear-button {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid #d9e0ec;
      border-radius: 14px;
      background: white;
      color: #26354f;
      box-shadow: 0 8px 24px rgba(31, 50, 81, .10);
      cursor: pointer;
    }
    .gear-button:hover { background: #f7f9fc; }
    .gear-button svg { width: 23px; height: 23px; }
    .settings {
      position: fixed;
      top: 78px;
      right: 20px;
      width: min(360px, calc(100vw - 40px));
      background: #fff;
      border: 1px solid #dfe5ef;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 24px 70px rgba(31, 50, 81, .18);
      z-index: 10;
    }
    .settings[hidden] { display: none; }
    .settings h2 { margin: 0 0 6px; font-size: 20px; }
    .settings .sub { margin: 0 0 18px; color: #6a7589; font-size: 14px; }
    .row { display: grid; gap: 7px; margin-top: 16px; }
    .row-inline { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    label { font-size: 14px; font-weight: 700; color: #33415c; }
    select, input[type="range"] { width: 100%; }
    select {
      padding: 10px 12px;
      border: 1px solid #d9e0ec;
      border-radius: 10px;
      background: #fff;
      color: #172033;
    }
    .value { font-variant-numeric: tabular-nums; color: #667085; font-size: 13px; }
    .test-button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 14px;
      border: 0;
      border-radius: 11px;
      background: #3157a4;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .test-button:hover { filter: brightness(.96); }
    main {
      width: min(900px, 100%);
      margin: 11vh auto 0;
      background: white;
      border: 1px solid #dfe5ef;
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 24px 70px rgba(31, 50, 81, 0.12);
    }
    .tag {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: #eef3ff;
      color: #3157a4;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .02em;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(42px, 7vw, 78px);
      line-height: .95;
      letter-spacing: -0.05em;
    }
    main p {
      margin: 0;
      max-width: 680px;
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.55;
      color: #536078;
    }
    .status {
      margin-top: 36px;
      padding: 18px 20px;
      border-radius: 16px;
      background: #f7f9fc;
      border: 1px solid #e5eaf2;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 15px;
    }
    @media (max-width: 600px) {
      body { padding: 16px; }
      .gear-button { top: 14px; right: 14px; }
      .settings { top: 70px; right: 14px; width: calc(100vw - 28px); }
      main { margin-top: 90px; padding: 30px 24px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <button class="gear-button" id="settingsButton" type="button" aria-label="Abrir configurações" aria-expanded="false" aria-controls="settingsPanel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-1.55V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.55 1H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"></path>
    </svg>
  </button>

  <aside class="settings" id="settingsPanel" hidden>
    <h2>Configurações</h2>
    <p class="sub">Áudio e narração</p>

    <div class="row-inline">
      <label for="audioEnabled">Narração</label>
      <input id="audioEnabled" type="checkbox" checked />
    </div>

    <div class="row">
      <label for="voiceSelect">Voz</label>
      <select id="voiceSelect">
        <option value="">Voz padrão do dispositivo</option>
      </select>
    </div>

    <div class="row">
      <div class="row-inline"><label for="rate">Velocidade</label><span class="value" id="rateValue">1.0×</span></div>
      <input id="rate" type="range" min="0.5" max="1.8" step="0.1" value="1" />
    </div>

    <div class="row">
      <div class="row-inline"><label for="pitch">Tom</label><span class="value" id="pitchValue">1.0</span></div>
      <input id="pitch" type="range" min="0" max="2" step="0.1" value="1" />
    </div>

    <div class="row">
      <div class="row-inline"><label for="volume">Volume</label><span class="value" id="volumeValue">100%</span></div>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" />
    </div>

    <button class="test-button" id="testVoice" type="button">Testar voz</button>
  </aside>

  <main>
    <span class="tag">TESTE DE TTS</span>
    <h1>Português Completo</h1>
    <p>Use a engrenagem no canto superior direito para escolher a voz, velocidade, tom e volume da narração.</p>
    <div class="status">Áudio: síntese de voz do próprio navegador/dispositivo</div>
  </main>

  <script>
    const synth = window.speechSynthesis;
    const settingsButton = document.getElementById('settingsButton');
    const settingsPanel = document.getElementById('settingsPanel');
    const audioEnabled = document.getElementById('audioEnabled');
    const voiceSelect = document.getElementById('voiceSelect');
    const rate = document.getElementById('rate');
    const pitch = document.getElementById('pitch');
    const volume = document.getElementById('volume');
    const rateValue = document.getElementById('rateValue');
    const pitchValue = document.getElementById('pitchValue');
    const volumeValue = document.getElementById('volumeValue');
    const testVoice = document.getElementById('testVoice');
    let voices = [];

    settingsButton.addEventListener('click', () => {
      const opening = settingsPanel.hidden;
      settingsPanel.hidden = !opening;
      settingsButton.setAttribute('aria-expanded', String(opening));
    });

    function loadVoices() {
      voices = synth.getVoices();
      const portuguese = voices.filter(v => v.lang.toLowerCase().startsWith('pt'));
      const visible = portuguese.length ? portuguese : voices;
      const selected = voiceSelect.value;
      voiceSelect.innerHTML = '<option value="">Voz padrão do dispositivo</option>';
      visible.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = `${voice.name} — ${voice.lang}${voice.localService ? ' (local)' : ''}`;
        voiceSelect.appendChild(option);
      });
      if ([...voiceSelect.options].some(option => option.value === selected)) voiceSelect.value = selected;
    }

    loadVoices();
    if ('onvoiceschanged' in synth) synth.addEventListener('voiceschanged', loadVoices);

    rate.addEventListener('input', () => rateValue.textContent = `${Number(rate.value).toFixed(1)}×`);
    pitch.addEventListener('input', () => pitchValue.textContent = Number(pitch.value).toFixed(1));
    volume.addEventListener('input', () => volumeValue.textContent = `${Math.round(Number(volume.value) * 100)}%`);

    testVoice.addEventListener('click', () => {
      if (!audioEnabled.checked) return;
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance('Olá. Esta é uma demonstração da voz escolhida para o curso Português Completo.');
      utterance.lang = 'pt-BR';
      utterance.rate = Number(rate.value);
      utterance.pitch = Number(pitch.value);
      utterance.volume = Number(volume.value);
      const chosen = voices.find(v => v.voiceURI === voiceSelect.value);
      if (chosen) utterance.voice = chosen;
      synth.speak(utterance);
    });
  </script>
</body>
</html>
